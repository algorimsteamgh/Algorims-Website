name: Deploy website to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify
        env:
          PUBLIC_WEB3FORMS_CONTACT_KEY: ${{ secrets.WEB3FORMS_CONTACT_KEY }}
          PUBLIC_WEB3FORMS_SUPPORT_KEY: ${{ secrets.WEB3FORMS_SUPPORT_KEY }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::561580620525:role/AlgorimsWebsiteGitHubDeploy
          aws-region: ap-south-1

      - name: Upload website
        run: aws s3 sync dist/ s3://algorims-website-561580620525 --delete

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id ESYSC15E546OI --paths "/*"
