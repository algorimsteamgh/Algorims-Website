# ============================================================
#  Algorims — nginx site config
#  Static site behind Cloudflare (DNS + proxy) on EC2.
#  Place at: /etc/nginx/sites-available/algorims.conf
#  then: sudo ln -s /etc/nginx/sites-available/algorims.conf /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;

    # Cloudflare redirects algorims.com -> www at the edge, but answer both
    # in case the origin is hit directly.
    server_name www.algorims.com algorims.com;

    # Path where you uploaded the site (index.html, /services/, /blog/, assets/, ...)
    root /var/www/html;
    index index.html;

    # ----- Routing -----
    # SPA routing: serve static assets directly, fall back to root index.html
    # for all routes so the JS router handles /services, /blog/slug, etc.
    # $uri/ (with the trailing slash) is required so directory-style static
    # pages like /products/cxiq/ resolve to their own index.html instead of
    # silently falling through to the homepage.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Custom 404 page (boots the SPA and shows a friendly page)
    error_page 404 /404.html;

    # ----- Caching -----
    # Long-cache fingerprint-free assets are fine here because images rarely change;
    # bump the asset filename if you ever need to force a refresh.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Always re-fetch HTML so content/SEO updates show immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SEO files
    location = /robots.txt  { add_header Cache-Control "public, max-age=86400"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=86400"; }

    # ----- Compression (Cloudflare also compresses at the edge) -----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Small hardening
    server_tokens off;
}
