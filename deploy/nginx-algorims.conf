# ============================================================
#  Algorims — nginx reverse proxy for Next.js
#  Assumes `npm run start` is running on 127.0.0.1:3000
#  Place at: /etc/nginx/sites-available/algorims.conf
#  then: sudo ln -s /etc/nginx/sites-available/algorims.conf /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream algorims_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;

    server_name www.algorims.com algorims.com;

    location /_next/static/ {
        proxy_pass http://algorims_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /assets/ {
        proxy_pass http://algorims_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://algorims_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    server_tokens off;
}
