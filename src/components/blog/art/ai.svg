<svg viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg" class="h-full w-full block" preserveAspectRatio="xMidYMid slice" role="img">

    <defs>
      <!-- Gradients -->
      <linearGradient id="bp-purple" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="hsl(258 88% 50%)"/>
        <stop offset="55%" stop-color="hsl(275 90% 62%)"/>
        <stop offset="100%" stop-color="hsl(290 95% 74%)"/>
      </linearGradient>
      <linearGradient id="bp-purple-2" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"  stop-color="hsl(275 90% 65%)"/>
        <stop offset="100%" stop-color="hsl(258 80% 48%)"/>
      </linearGradient>
      <linearGradient id="bp-coral" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="hsl(330 85% 65%)"/>
        <stop offset="100%" stop-color="hsl(290 90% 70%)"/>
      </linearGradient>
      <linearGradient id="bp-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="hsl(195 85% 60%)"/>
        <stop offset="100%" stop-color="hsl(265 85% 65%)"/>
      </linearGradient>
      <linearGradient id="bp-card" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"  stop-color="white"/>
        <stop offset="100%" stop-color="hsl(265 40% 97%)"/>
      </linearGradient>
      <linearGradient id="bp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="hsl(265 50% 97%)"/>
        <stop offset="100%" stop-color="hsl(280 50% 94%)"/>
      </linearGradient>
      <radialGradient id="bp-glow" cx="50%" cy="50%" r="60%">
        <stop offset="0%"   stop-color="hsl(280 95% 70% / 0.55)"/>
        <stop offset="55%"  stop-color="hsl(265 85% 58% / 0.18)"/>
        <stop offset="100%" stop-color="hsl(265 85% 58% / 0)"/>
      </radialGradient>
      <radialGradient id="bp-glow-coral" cx="50%" cy="50%" r="60%">
        <stop offset="0%"   stop-color="hsl(325 90% 70% / 0.45)"/>
        <stop offset="100%" stop-color="hsl(325 90% 70% / 0)"/>
      </radialGradient>

      <!-- Subtle dot pattern -->
      <pattern id="bp-dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="11" cy="11" r="0.9" fill="hsl(265 60% 55% / 0.13)"/>
      </pattern>
      <!-- Cross-hatch grid (sparse) -->
      <pattern id="bp-grid" width="48" height="48" patternUnits="userSpaceOnUse">
        <path d="M 48 0 L 0 0 0 48" fill="none" stroke="hsl(265 60% 65% / 0.08)" stroke-width="0.8"/>
      </pattern>

      <!-- Shadows -->
      <filter id="bp-shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="hsl(265 70% 25%)" flood-opacity="0.10"/>
      </filter>
      <filter id="bp-shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="hsl(265 70% 30%)" flood-opacity="0.18"/>
      </filter>
      <filter id="bp-soft" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.5"/>
      </filter>
    </defs>
      <rect width="600" height="360" fill="url(#bp-bg)"/>
      <rect width="600" height="360" fill="url(#bp-grid)"/>

      <!-- ambient washes -->
      <circle cx="370" cy="180" r="220" fill="url(#bp-glow)"/>
      <circle cx="120" cy="280" r="120" fill="url(#bp-glow-coral)" opacity="0.55"/>

      <!-- outer ring connections -->
      <line x1="497.24947147410404" y1="249.51670309760942" x2="460.16612516139423" y2="198.27757843314564" stroke="hsl(265 60% 65% / 0.32)" stroke-width="0.8"/><line x1="445.44292336591263" y1="303.82796660692213" x2="420.8328788811906" y2="256.6812781886831" stroke="hsl(265 60% 65% / 0.32)" stroke-width="0.8"/><line x1="373.4215048671819" y1="324.9596264635221" x2="351.7224215668544" y2="270.16612516139423" stroke="hsl(265 60% 65% / 0.32)" stroke-width="0.8"/><line x1="300.4832969023906" y1="307.24947147410404" x2="293.3187218113169" y2="230.83287888119057" stroke="hsl(265 60% 65% / 0.32)" stroke-width="0.8"/><line x1="246.17203339307787" y1="255.44292336591266" x2="279.83387483860577" y2="161.72242156685436" stroke="hsl(265 60% 65% / 0.32)" stroke-width="0.8"/><line x1="225.04037353647792" y1="183.42150486718188" x2="319.1671211188094" y2="103.31872181131688" stroke="hsl(265 60% 65% / 0.32)" stroke-width="0.8"/><line x1="242.75052852589596" y1="110.48329690239058" x2="388.2775784331456" y2="89.83387483860577" stroke="hsl(265 60% 65% / 0.32)" stroke-width="0.8"/><line x1="294.55707663408725" y1="56.17203339307788" x2="446.6812781886831" y2="129.1671211188094" stroke="hsl(265 60% 65% / 0.32)" stroke-width="0.8"/><line x1="366.57849513281803" y1="35.040373536477915" x2="460.16612516139423" y2="198.27757843314564" stroke="hsl(265 60% 65% / 0.32)" stroke-width="0.8"/><line x1="439.5167030976094" y1="52.750528525895945" x2="420.8328788811906" y2="256.6812781886831" stroke="hsl(265 60% 65% / 0.32)" stroke-width="0.8"/><line x1="493.8279666069222" y1="104.55707663408737" x2="351.7224215668544" y2="270.16612516139423" stroke="hsl(265 60% 65% / 0.32)" stroke-width="0.8"/><line x1="514.9596264635221" y1="176.57849513281806" x2="293.3187218113169" y2="230.83287888119057" stroke="hsl(265 60% 65% / 0.32)" stroke-width="0.8"/>
      <!-- ring 2 small nodes -->
      <circle cx="497.24947147410404" cy="249.51670309760942" r="3" fill="hsl(265 50% 70%)" opacity="0.45"/><circle cx="445.44292336591263" cy="303.82796660692213" r="4" fill="hsl(265 50% 70%)" opacity="0.6"/><circle cx="373.4215048671819" cy="324.9596264635221" r="5" fill="hsl(265 50% 70%)" opacity="0.75"/><circle cx="300.4832969023906" cy="307.24947147410404" r="3" fill="hsl(265 50% 70%)" opacity="0.45"/><circle cx="246.17203339307787" cy="255.44292336591266" r="4" fill="hsl(265 50% 70%)" opacity="0.6"/><circle cx="225.04037353647792" cy="183.42150486718188" r="5" fill="hsl(265 50% 70%)" opacity="0.75"/><circle cx="242.75052852589596" cy="110.48329690239058" r="3" fill="hsl(265 50% 70%)" opacity="0.45"/><circle cx="294.55707663408725" cy="56.17203339307788" r="4" fill="hsl(265 50% 70%)" opacity="0.6"/><circle cx="366.57849513281803" cy="35.040373536477915" r="5" fill="hsl(265 50% 70%)" opacity="0.75"/><circle cx="439.5167030976094" cy="52.750528525895945" r="3" fill="hsl(265 50% 70%)" opacity="0.45"/><circle cx="493.8279666069222" cy="104.55707663408737" r="4" fill="hsl(265 50% 70%)" opacity="0.6"/><circle cx="514.9596264635221" cy="176.57849513281806" r="5" fill="hsl(265 50% 70%)" opacity="0.75"/>

      <!-- spokes to inner ring -->
      <line x1="370" y1="180" x2="460.16612516139423" y2="198.27757843314564" stroke="url(#bp-purple)" stroke-width="1.2" opacity="0.55"/><line x1="370" y1="180" x2="420.8328788811906" y2="256.6812781886831" stroke="url(#bp-purple)" stroke-width="1.2" opacity="0.55"/><line x1="370" y1="180" x2="351.7224215668544" y2="270.16612516139423" stroke="url(#bp-purple)" stroke-width="1.2" opacity="0.55"/><line x1="370" y1="180" x2="293.3187218113169" y2="230.83287888119057" stroke="url(#bp-purple)" stroke-width="1.2" opacity="0.55"/><line x1="370" y1="180" x2="279.83387483860577" y2="161.72242156685436" stroke="url(#bp-purple)" stroke-width="1.2" opacity="0.55"/><line x1="370" y1="180" x2="319.1671211188094" y2="103.31872181131688" stroke="url(#bp-purple)" stroke-width="1.2" opacity="0.55"/><line x1="370" y1="180" x2="388.2775784331456" y2="89.83387483860577" stroke="url(#bp-purple)" stroke-width="1.2" opacity="0.55"/><line x1="370" y1="180" x2="446.6812781886831" y2="129.1671211188094" stroke="url(#bp-purple)" stroke-width="1.2" opacity="0.55"/>
      <!-- ring 1 medium nodes -->

        <circle cx="460.16612516139423" cy="198.27757843314564" r="8" fill="url(#bp-purple)" filter="url(#bp-shadow-sm)"/>
        <circle cx="458.16612516139423" cy="196.27757843314564" r="2" fill="white" opacity="0.8"/>

        <circle cx="420.8328788811906" cy="256.6812781886831" r="10" fill="url(#bp-purple)" filter="url(#bp-shadow-sm)"/>
        <circle cx="418.8328788811906" cy="254.6812781886831" r="2" fill="white" opacity="0.8"/>

        <circle cx="351.7224215668544" cy="270.16612516139423" r="8" fill="url(#bp-purple)" filter="url(#bp-shadow-sm)"/>
        <circle cx="349.7224215668544" cy="268.16612516139423" r="2" fill="white" opacity="0.8"/>

        <circle cx="293.3187218113169" cy="230.83287888119057" r="10" fill="url(#bp-purple)" filter="url(#bp-shadow-sm)"/>
        <circle cx="291.3187218113169" cy="228.83287888119057" r="2" fill="white" opacity="0.8"/>

        <circle cx="279.83387483860577" cy="161.72242156685436" r="8" fill="url(#bp-purple)" filter="url(#bp-shadow-sm)"/>
        <circle cx="277.83387483860577" cy="159.72242156685436" r="2" fill="white" opacity="0.8"/>

        <circle cx="319.1671211188094" cy="103.31872181131688" r="10" fill="url(#bp-purple)" filter="url(#bp-shadow-sm)"/>
        <circle cx="317.1671211188094" cy="101.31872181131688" r="2" fill="white" opacity="0.8"/>

        <circle cx="388.2775784331456" cy="89.83387483860577" r="8" fill="url(#bp-purple)" filter="url(#bp-shadow-sm)"/>
        <circle cx="386.2775784331456" cy="87.83387483860577" r="2" fill="white" opacity="0.8"/>

        <circle cx="446.6812781886831" cy="129.1671211188094" r="10" fill="url(#bp-purple)" filter="url(#bp-shadow-sm)"/>
        <circle cx="444.6812781886831" cy="127.1671211188094" r="2" fill="white" opacity="0.8"/>


      <!-- core node -->
      <g filter="url(#bp-shadow)">
        <circle cx="370" cy="180" r="42" fill="url(#bp-purple)"/>
        <circle cx="370" cy="180" r="42" fill="url(#bp-glow)" opacity="0.6"/>
        <circle cx="370" cy="180" r="28" fill="hsl(280 95% 78%)" opacity="0.5"/>
        <circle cx="358" cy="168" r="8" fill="white" opacity="0.85"/>
        <circle cx="384" cy="190" r="4" fill="white" opacity="0.5"/>
      </g>

      <!-- corner mark -->
      <g transform="translate(36,36)">
        <rect width="92" height="26" rx="13" fill="white" filter="url(#bp-shadow-sm)"/>
        <circle cx="14" cy="13" r="4" fill="url(#bp-purple)"/>
        <text x="24" y="17" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" font-weight="700" letter-spacing="1.5" fill="hsl(265 35% 30%)">AI · ML</text>
      </g>

      <!-- small floating chips for life -->
      <g transform="translate(70,80)" filter="url(#bp-shadow-sm)">
        <rect width="62" height="20" rx="10" fill="white"/>
        <rect x="8" y="6" width="46" height="3" rx="1.5" fill="hsl(265 30% 80%)"/>
        <rect x="8" y="12" width="28" height="3" rx="1.5" fill="hsl(265 30% 88%)"/>
      </g>
      <g transform="translate(440,290)" filter="url(#bp-shadow-sm)">
        <rect width="80" height="24" rx="12" fill="white"/>
        <circle cx="14" cy="12" r="4" fill="url(#bp-coral)"/>
        <rect x="24" y="9" width="44" height="6" rx="3" fill="hsl(265 30% 90%)"/>
      </g>

    </svg>
